# 中文版 esp32sim 的发布流水线(GitHub Actions)
# 密钥:仓库 Settings → Secrets and variables → Actions → New repository secret
#        DEEPSEEK_API_KEY(翻译)
#
# 什么时候真的编译:
#   - 定时(每天 10:00 北京时间):只有上游 main 或最新 tag 变了才编译、才发版
#   - 手动触发:总是编译并发版
#   - push 到 zh:只编译验证,不发版
# 上次编译的上游状态记在 zh/last-upstream.txt,提交回仓库。
name: zh-release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_translate:
        description: '跳过翻译,只用现有译文构建'
        required: false
        default: 'false'
  push:
    branches: [zh]

permissions:
  contents: write

concurrency:
  group: zh-release
  cancel-in-progress: false

jobs:
  check:
    name: 检查上游是否有更新
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      upstream: ${{ steps.cmp.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 对比上游状态
        id: cmp
        run: |
          set -e
          git remote add upstream https://github.com/mikroverk/esp32sim.git
          git fetch upstream --tags --force -q
          up_sha=$(git rev-parse upstream/main)
          up_tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          want="$up_tag $up_sha"
          echo "upstream=$want" >> "$GITHUB_OUTPUT"
          last=""
          if [ -f zh/last-upstream.txt ]; then last=$(tr -d '\r' < zh/last-upstream.txt | head -1); fi
          echo "上游最新: $want"
          echo "上次构建: ${last:-（还没记录）}"
          case "${{ github.event_name }}" in
            push) echo "changed=true" >> "$GITHUB_OUTPUT"; echo "push 事件:只验证构建,不发版" ;;
            workflow_dispatch) echo "changed=true" >> "$GITHUB_OUTPUT"; echo "手动触发:强制构建" ;;
            *)
              if [ "$last" = "$want" ]; then
                echo "changed=false" >> "$GITHUB_OUTPUT"
                echo "上游没有更新,跳过编译"
              else
                echo "changed=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

  translate:
    needs: check
    if: needs.check.outputs.changed == 'true' && inputs.skip_translate != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉取上游 tag
        run: |
          git remote add upstream https://github.com/mikroverk/esp32sim.git
          git fetch upstream --tags --force -q

      - name: 发现上游新增文案
        run: |
          set -e
          node tools/zh-discover.mjs
          node tools/zh-discover.mjs --write

      - name: 增量翻译
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node tools/zh-translate.mjs --dry-run || true
          if [ -n "$DEEPSEEK_API_KEY" ]; then node tools/zh-translate.mjs; else echo "未配置 DEEPSEEK_API_KEY,跳过真实翻译"; fi

      - name: 质量门禁
        run: node tools/zh-check.mjs

      - name: 提交译文变更
        run: |
          if git diff --quiet -- zh/; then echo "译文无变化"; exit 0; fi
          git config user.name "esp32sim-zh bot"
          git config user.email "bot@users.noreply.github.com"
          git add zh/
          git commit -m "zh: 更新译文"
          git push

  build:
    needs: [check, translate]
    if: needs.check.outputs.changed == 'true' && (needs.translate.result == 'success' || needs.translate.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64
          - target: x86_64-pc-windows-gnu
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装交叉工具链
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu
          rustup target add "${{ matrix.target }}"

      - name: crates 镜像(国内加速)
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "rsproxy"
          [source.rsproxy]
          registry = "sparse+https://rsproxy.cn/index/"
          [net]
          git-fetch-with-cli = true
          EOF

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: 生成 build-src(模式 B)
        run: |
          OVL="$PWD/.build/overlay"
          mkdir -p "$OVL/docs"
          cp -r docs/zh "$OVL/docs/zh"
          node tools/apply-zh.mjs --upstream . --out .build/build-src --strings zh/strings.json --overlay "$OVL"

      - name: 编译
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.build/target
        run: |
          set -e
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export RUSTFLAGS="-C link-arg=-fuse-ld=bfd"
          fi
          cargo build --release -p esp32sim --target "${{ matrix.target }}" --manifest-path .build/build-src/Cargo.toml

      - name: 打包
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.build/target
        run: |
          set -e
          ver=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          pkg="esp32sim-${ver}-zh-${{ matrix.platform }}"
          mkdir -p "dist/$pkg/docs" "dist/$pkg/tools"
          rel="$CARGO_TARGET_DIR/${{ matrix.target }}/release"
          for b in esp32sim esp32sim-c3 esp32sim-c6 esp32sim-p4 esp32sim-s31; do
            if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then cp "$rel/$b.exe" "dist/$pkg/$b.exe"; else cp "$rel/$b" "dist/$pkg/$b"; fi
          done
          cp LICENSE "dist/$pkg/" 2>/dev/null || true
          cp README.md "dist/$pkg/" 2>/dev/null || true
          cp .build/build-src/docs/zh/*.md "dist/$pkg/docs/" 2>/dev/null || true
          cp .build/build-src/tools/fetch-rom-elfs.sh "dist/$pkg/tools/" 2>/dev/null || true
          cp -r .build/build-src/web "dist/$pkg/web"
          rm -rf "dist/$pkg/web/wasm/fw/public"
          tar -czf "dist/$pkg.tar.gz" -C dist "$pkg"
          rm -rf "dist/$pkg"
          cd dist && sha256sum ./*.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 冒烟(linux-x86_64 真跑)
        if: matrix.platform == 'linux-x86_64'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.build/target
        run: |
          set -e
          exe="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/esp32sim"
          "$exe" --version
          "$exe" --help 2>&1 | head -1 | grep -q '^usage:'
          set +e; "$exe" --adc x >/dev/null 2>&1; code=$?; set -e
          [ "$code" = "2" ]
          file "$exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.tar.gz

  publish:
    needs: [check, translate, build]
    # push 只验证构建;定时或手动才发版,且只有上游真变了才发
    if: needs.check.outputs.changed == 'true' && needs.build.result == 'success' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 读出上游版本号
        id: ver
        run: |
          ver=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}-zh.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "版本: $ver / 标签: v${ver}-zh.${GITHUB_RUN_NUMBER}"

      - name: 汇总校验和
        run: cd dist && sha256sum ./*.tar.gz | tee SHA256SUMS.txt

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: esp32sim ${{ steps.ver.outputs.version }} 中文版(#${{ github.run_number }})
          body: |
            自动构建:发现新文案 → DeepSeek 增量翻译 → 质量门禁 → 三平台交叉编译。

            - 仓库:${{ github.repository }}
            - 上游:${{ needs.check.outputs.upstream }}
            - 产物:linux-x86_64、linux-arm64、windows-x86_64(含 SHA256SUMS)
          files: dist/*
          fail_on_unmatched_files: true

      - name: 记录本次构建的上游状态
        run: |
          set -e
          echo "${{ needs.check.outputs.upstream }}" > zh/last-upstream.txt
          if git diff --quiet -- zh/last-upstream.txt 2>/dev/null; then echo "记录未变"; exit 0; fi
          git config user.name "esp32sim-zh bot"
          git config user.email "bot@users.noreply.github.com"
          git add zh/last-upstream.txt
          git commit -m "zh: 记录已构建的上游版本 ${{ needs.check.outputs.upstream }}"
          git push
